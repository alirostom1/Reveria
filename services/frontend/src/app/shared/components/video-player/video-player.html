<div
  class="group relative overflow-hidden rounded-lg bg-black"
  (mousemove)="showControls()"
  (mouseleave)="hideControlsDelayed()"
  (click)="togglePlay()"
>
  <video
    #videoElement
    class="h-full w-full"
    playsinline
    (timeupdate)="onTimeUpdate()"
    (loadedmetadata)="onMetadataLoaded()"
    (ended)="playing.set(false)"
    (waiting)="buffering.set(true)"
    (canplay)="onCanPlay()"
    (playing)="buffering.set(false)"
  ></video>

  <!-- Loading / Buffering spinner -->
  @if (loading() || buffering()) {
    <div class="pointer-events-none absolute inset-0 flex items-center justify-center bg-black/20">
      <div class="h-11 w-11 animate-spin rounded-full border-[3px] border-white/20 border-t-white"></div>
    </div>
  }

  <!-- Big play button (center, when paused) -->
  @if (!playing() && !buffering() && !loading()) {
    <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
      <div class="flex h-14 w-14 items-center justify-center rounded-full bg-black/40 backdrop-blur-sm transition-transform hover:scale-105">
        <svg class="ml-0.5 h-7 w-7 text-white drop-shadow" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
      </div>
    </div>
  }

  <!-- Bottom controls bar -->
  <div
    class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent px-3 pb-2.5 pt-12 transition-opacity duration-300"
    [class.opacity-0]="playing() && !controlsVisible()"
    [class.opacity-100]="!playing() || controlsVisible()"
    (click)="$event.stopPropagation()"
  >
    <!-- Progress bar (hidden in live mode) -->
    @if (!live) {
      <div
        class="group/progress mb-1.5 flex cursor-pointer items-center py-1"
        (click)="seek($event)"
        #progressBar
      >
        <div class="relative h-[3px] w-full rounded-full bg-white/25 transition-[height] duration-150 group-hover/progress:h-[5px]">
          <div
            class="absolute left-0 top-0 h-full rounded-full bg-white/20"
            [style.width.%]="bufferedPercent()"
          ></div>
          <div
            class="absolute left-0 top-0 h-full rounded-full bg-coral-500 transition-[width] duration-75"
            [style.width.%]="progressPercent()"
          >
            <div class="absolute -top-[5px] right-0 h-[13px] w-[13px] translate-x-1/2 scale-0 rounded-full bg-coral-500 shadow-sm transition-transform duration-150 group-hover/progress:scale-100"></div>
          </div>
        </div>
      </div>
    }

    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <!-- Play/Pause -->
        <button (click)="togglePlay()" class="text-white/90 transition-colors hover:text-white">
          @if (playing()) {
            <svg class="h-[22px] w-[22px]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
            </svg>
          } @else {
            <svg class="h-[22px] w-[22px]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
          }
        </button>

        <!-- Volume -->
        <div class="group/vol flex items-center gap-1">
          <button (click)="toggleMute()" class="text-white/90 transition-colors hover:text-white">
            @if (muted() || volume() === 0) {
              <svg class="h-[22px] w-[22px]" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z" />
              </svg>
            } @else {
              <svg class="h-[22px] w-[22px]" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
              </svg>
            }
          </button>
          <div class="relative h-1 w-0 rounded-full transition-all duration-200 group-hover/vol:w-14">
            <div class="absolute inset-0 rounded-full bg-white/25"></div>
            <div
              class="absolute inset-y-0 left-0 rounded-full bg-white"
              [style.width.%]="(muted() ? 0 : volume()) * 100"
            >
              <div class="absolute -top-[3px] right-0 h-[10px] w-[10px] translate-x-1/2 scale-0 rounded-full bg-white shadow-sm transition-transform duration-150 group-hover/vol:scale-100"></div>
            </div>
            <input
              type="range"
              min="0"
              max="1"
              step="0.05"
              [value]="volume()"
              (input)="onVolumeChange($event)"
              class="vol-slider absolute inset-0 cursor-pointer opacity-0"
            />
          </div>
        </div>

        <!-- Time / Live badge -->
        @if (live) {
          <span class="ml-0.5 flex items-center gap-1.5 rounded-sm bg-red-600 px-2 py-0.5 text-[11px] font-bold uppercase text-white">
            <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-white"></span>
            LIVE
          </span>
        } @else {
          <span class="ml-0.5 text-[11px] font-medium tabular-nums text-white/70">
            {{ formatTime(currentTime()) }} / {{ formatTime(duration()) }}
          </span>
        }
      </div>

      <div class="flex items-center gap-1">
        <!-- Quality selector -->
        @if (qualities().length > 1) {
          <div class="relative">
            <button
              (click)="qualityMenuOpen.set(!qualityMenuOpen())"
              class="flex items-center gap-1 rounded-sm px-1.5 py-1 text-white/70 transition-colors hover:text-white"
            >
              <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <span class="text-[11px] font-medium">{{ currentQuality() }}</span>
            </button>
            @if (qualityMenuOpen()) {
              <div class="absolute bottom-full right-0 mb-1.5 min-w-[90px] overflow-hidden rounded-md bg-stone-900/95 py-1 shadow-lg backdrop-blur">
                @for (q of qualities(); track q.index) {
                  <button
                    (click)="setQuality(q.index)"
                    class="flex w-full items-center justify-between gap-2 px-3 py-1.5 text-left text-[11px] font-medium transition-colors"
                    [class]="q.locked
                      ? 'text-white/30 cursor-not-allowed'
                      : q.active
                        ? 'text-coral-400 hover:bg-white/10'
                        : 'text-white/70 hover:text-white hover:bg-white/10'"
                  >
                    <span class="flex items-center gap-1.5">
                      {{ q.label }}
                      @if (q.locked) {
                        <span class="rounded bg-coral-500/80 px-1 py-px text-[9px] font-bold leading-tight text-white">PRO</span>
                      }
                    </span>
                    @if (q.active) {
                      <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" clip-rule="evenodd" />
                      </svg>
                    }
                    @if (q.locked) {
                      <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 0 0-4.5 4.5V9H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-.5V5.5A4.5 4.5 0 0 0 10 1Zm3 8V5.5a3 3 0 1 0-6 0V9h6Z" clip-rule="evenodd" />
                      </svg>
                    }
                  </button>
                }
              </div>
            }
          </div>
        }

        <!-- Fullscreen -->
        <button (click)="toggleFullscreen()" class="rounded-sm p-1 text-white/70 transition-colors hover:text-white">
          <svg class="h-[18px] w-[18px]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
