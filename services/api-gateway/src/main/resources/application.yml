spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 50MB
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/auth/**,/api/mod/**,/api/profile/**,/api/user/**,/api/users/**
            - id: social-service
              uri: ${SOCIAL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/social/**
            - id: content-service
              uri: ${CONTENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/content/**
            - id: content-service-ws
              uri: ${CONTENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/ws/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${FRONTEND_URL:http://localhost:4200}
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Accept
                allow-credentials: true
                max-age: 3600

server:
  port: 8090
  address: 0.0.0.0
  netty:
    max-initial-line-length: 65536
  max-http-request-header-size: 65536

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

gateway:
  public-paths:
    - /api/auth/register
    - /api/auth/login
    - /api/auth/refresh
    - /api/auth/oauth
    - /api/auth/oauth/*/url
    - /api/auth/forgot-password
    - /api/auth/reset-password
    - /api/auth/reset-password/validate
    - /api/auth/verify-email
    - /api/auth/verify-email/validate
    - /api/auth/resend-verification
    - /api/mod/auth/login
    - /api/mod/auth/refresh
    - /api/content/videos
    - /api/content/videos/*
    - /api/content/videos/*/comments
    - /api/content/videos/*/view
    - /api/content/videos/channel/*
    - /api/content/channels/*
    - /api/content/videos/download/**
    - /api/content/streams/live
    - /api/content/streams/*
    - /api/content/streams/active/*
    - /api/content/streams/channel/*
    - /api/content/streams/rtmp/**
    - /api/content/categories
    - /api/content/tags/**
    - /ws/**
    - /api/users/search
    - /api/users/*
    - /api/social/posts/feed/public
    - /actuator/**
